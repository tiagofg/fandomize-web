name: Deploy Web
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.REPO_PATH }}
            git pull origin main               # atualiza código :contentReference[oaicite:10]{index=10}
            docker compose build frontend     # build local do serviço :contentReference[oaicite:11]{index=11}
            docker compose up -d --no-deps --build frontend
